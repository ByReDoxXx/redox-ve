# RedoX VE kurulum ortamının yanıt dosyası (Debian kurucusu).
#
# Kurucu yalnızca şunları sorar: dil ve klavye, makine adı, kök parolası ve kurulacak disk (silmeden önce onay
# ister). Geri kalanı kendiliğinden yapılır: en küçük Debian sistemi, SSH sunucusu, ardından RedoX VE.

# Ağ: DHCP; makine adı sorulur.
d-i netcfg/choose_interface select auto
d-i netcfg/get_domain string

# Paket deposu.
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Hesaplar: yalnızca kök (parolası sorulur); olağan kullanıcı oluşturulmaz.
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false

# Saat.
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# Disk: hangi diske kurulacağı sorulur ve yazmadan önce onay istenir; düzen tek bölümdür.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic

# Paketler: en küçük sistem ve SSH.
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string ca-certificates
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false
d-i apt-setup/cdrom/set-first boolean false

# Önyükleyici.
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# RedoX VE: dosyalar kurulum ortamından kopyalanır ve kurulum betiği yeni sistemin içinde çalıştırılır.
d-i preseed/late_command string mkdir -p /target/opt/redox-install; cp -r /cdrom/redox/. /target/opt/redox-install/; in-target sh /opt/redox-install/install.sh --from-installer --binary /opt/redox-install/redox

d-i finish-install/reboot_in_progress note
