[package]
name = "redox-server"
version.workspace = true
edition.workspace = true
description = "RedoX VE sunucusu: REST API, sunucuda üretilen arayüz ve redox komut satırı"

[lib]
name = "redox_server"

[[bin]]
name = "redox"
path = "src/main.rs"

[dependencies]
redox-core = { path = "../redox-core" }
axum = { version = "0.8", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util"] }
maud = "0.27"
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
argon2 = "0.5"
getrandom = "0.2"
sha2 = "0.10"
subtle = "2"
rpassword = "7"
serde_urlencoded = "0.7"
hmac = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
futures-util = "0.3"
chacha20poly1305 = "0.10"
sha1 = "0.10"
# Güvenlik anahtarı imzaları; TLS için zaten derlenen kitaplık.
ring = "0.17"
zstd = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.26"
